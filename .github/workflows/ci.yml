name: CI

# Runs the same checks as `npm run lint`, `npx tsc --noEmit` and `npm test` locally.
# GitGotchi reads this run's result for the repo's own pet (HP), so keep the job name stable.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
